name: CI Frontend
# lembrete: este workflow so dispara se a pasta do frontend se chamar exatamente quizArenaFront

on:
  push:
    branches:
      - main
      - front
    paths:
      - 'quizArenaFront/**'
  pull_request:
    branches:
      - main
      - front
    paths:
      - 'quizArenaFront/**'

jobs:
  build-and-analyze:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest
    
    # roda tudo dentro da pasta quizArenaFront
    defaults:
      run:
        working-directory: quizArenaFront
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # obrigatorio pro sonar ler o historico
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint || echo "sem lint"
        continue-on-error: true

      - name: Build Project
        run: npm run build || echo "sem build"

      # reservado para testes de cobertura no futuro
      # - name: Run tests
      #   run: npm run test:coverage

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: quizArenaFront
          args: >
            -Dsonar.projectKey=quizarenagt_front
            -Dsonar.organization=QuizArenaGt
